<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JobMap - Find Local Jobs in Your Neighborhood</title>
    <script>
        (function() {
            const path = window.location.pathname.toLowerCase();
            if (path === '/jobs' || path === '/map') {
                document.documentElement.classList.add('page-jobs');
            } else {
                document.documentElement.classList.add('page-home');
            }
        })();
    </script>
    <style>
        html.page-home #app-container { display: none !important; }
        html.page-home #landingMain { display: block !important; }
        html.page-home #landingInterface { display: flex !important; }

        html.page-jobs #app-container { display: flex !important; }
        html.page-jobs #landingMain { display: none !important; }
        html.page-jobs #landingInterface { display: none !important; }
    </style>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', '"Segoe UI"', 'Roboto', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- Premium Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- MapLibre GL CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" />
    <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
    <!-- Application CSS -->
    <link rel="stylesheet" href="/static/css/style.css">
    
    <style>
        body {
            font-family: var(--font-stack, 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
            letter-spacing: -0.01em;
            background-color: #f4f3f0;
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(15, 23, 42, 0.12); border-radius: 99px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(15, 23, 42, 0.25); }

        .map-land { fill: #f4f3f0; transition: fill 0.8s ease; }
        .map-water { fill: #aad3df; transition: d 0.8s ease, fill 0.8s ease; }
        .map-park { fill: #d0edd2; transition: all 0.8s ease; }
        .map-highway { stroke: #fcd299; stroke-width: 4px; fill: none; }
        .map-street { stroke: #ffffff; stroke-width: 2px; fill: none; }
        .map-rail { stroke: #cbd5e1; stroke-width: 1.5px; stroke-dasharray: 4,4; fill: none; }

        @keyframes pin-pop {
            0% { transform: scale(0.9) translate(-50%, -50%); }
            100% { transform: scale(1) translate(-50%, -50%); }
        }
        .animate-pin {
            animation: pin-pop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .blurred-map { filter: blur(20px) scale(1.04); transform-origin: center; }
        .clear-map { filter: blur(0px) scale(1.0); transform-origin: center; }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col select-none relative">

    <!-- FULL SCREEN INTERACTIVE GOOGLE MAP CANVAS / LANDING BACKDROP -->
    <main id="landingMain" class="absolute inset-0 w-full h-full z-10 bg-[#f4f3f0] overflow-hidden">
        <!-- SVG Map Backdrop -->
        <svg id="googleMapsBackdrop" class="absolute inset-0 w-full h-full transition-all duration-1000 ease-out blurred-map" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
            <rect class="map-land" width="100%" height="100%" />
            <path class="map-water" id="mapWater1" d="M100,200 C300,180 400,300 500,250 C600,200 700,350 850,220 C950,150 1200,300 1300,100 L1400,0 L1600,0 L1600,1000 L0,1000 Z" opacity="0.85" />
            <path class="map-water" id="mapWater2" d="M0,0 L300,0 C250,100 150,150 100,250 C80,290 0,320 0,350 Z" opacity="0.6" />
            <rect class="map-park" id="mapPark1" x="500" y="50" width="320" height="220" rx="30" opacity="0.75" />
            <path class="map-park" id="mapPark2" d="M1000,500 Q1150,450 1250,550 T1400,700 L1500,850 L1200,900 Z" opacity="0.7" />
            <circle class="map-park" id="mapPark3" cx="250" cy="750" r="120" opacity="0.65" />
            <g id="mapRoads" class="opacity-80">
                <path class="map-highway" d="M-50,450 L1920,450" />
                <path class="map-highway" d="M750,-50 L750,1080" />
                <path class="map-highway" d="M100,100 L1200,900" />
                <path class="map-street" d="M200,0 L200,1080" />
                <path class="map-street" d="M450,0 L450,1080" />
                <path class="map-street" d="M1100,0 L1100,1080" />
                <path class="map-street" d="M1350,0 L1350,1080" />
                <path class="map-street" d="M0,250 L1920,250" />
                <path class="map-street" d="M0,680 L1920,680" />
                <path class="map-street" d="M0,850 L1920,850" />
                <path class="map-rail" d="M-20,920 L1940,920" />
            </g>
        </svg>

        <div id="mapPinsContainer" class="absolute inset-0 pointer-events-none z-10 opacity-0 transition-opacity duration-1000"></div>
    </main>

    <!-- INITIAL LANDING STATE CONTAINER -->
    <div id="landingInterface" class="absolute inset-0 z-20 flex flex-col items-center justify-center p-4 transition-all duration-700 ease-out">
        <div class="max-w-xl w-full bg-white/95 backdrop-blur-xl rounded-3xl border border-white/60 shadow-[0_20px_50px_rgba(15,23,42,0.12)] p-8 text-center transition-all duration-500 transform scale-100 opacity-100">
            <div class="w-12 h-12 rounded-2xl bg-[#1a73e8]/10 text-[#1a73e8] flex items-center justify-center mx-auto mb-4 text-xl shadow-inner">
                <i class="fa-solid fa-magnifying-glass-location"></i>
            </div>
            <h1 class="text-3xl font-extrabold tracking-tight text-slate-900 leading-tight">
                Find jobs in your backyard.
            </h1>
            <p class="text-slate-500 text-xs mt-2 max-w-sm mx-auto leading-relaxed font-medium">
                Enter your location to reveal immediate roles across all industries plotted right onto your neighborhood map.
            </p>

            <div class="mt-6 space-y-2">
                <div class="flex flex-col sm:flex-row gap-2 p-1.5 bg-slate-100/80 rounded-2xl border border-slate-200/40">
                    <div class="relative flex-1 flex items-center pl-3 py-1 bg-white sm:bg-transparent rounded-xl sm:rounded-none">
                        <i class="fa-solid fa-location-dot text-[#ea4335] text-sm mr-2"></i>
                        <input id="landingCityInput" type="text" class="w-full bg-transparent text-sm font-bold text-slate-800 placeholder-slate-400 focus:outline-none" placeholder="Location (City, Area, ZIP)..." onkeydown="if(event.key === 'Enter') handleSearchFromLanding()">
                    </div>
                    <div class="hidden sm:block w-[1px] bg-slate-300/60 my-1"></div>
                    <div class="relative flex-1 flex items-center pl-3 py-1 bg-white sm:bg-transparent rounded-xl sm:rounded-none">
                        <i class="fa-solid fa-briefcase text-blue-500 text-sm mr-2"></i>
                        <input id="landingRoleInput" type="text" class="w-full bg-transparent text-sm font-bold text-slate-800 placeholder-slate-400 focus:outline-none" placeholder="Job Title / Role (optional)..." onkeydown="if(event.key === 'Enter') handleSearchFromLanding()">
                    </div>
                    <button onclick="handleSearchFromLanding()" class="bg-[#1a73e8] hover:bg-blue-700 text-white font-bold text-xs py-3 px-5 rounded-xl shadow-md shadow-blue-500/10 transition-all flex items-center justify-center gap-1.5 shrink-0 transform active:scale-95">
                        Search Jobs
                        <i class="fa-solid fa-arrow-right text-[10px]"></i>
                    </button>
                </div>
            </div>

            <div class="mt-4 flex items-center justify-center gap-1.5 text-xs flex-wrap">
                <span class="text-slate-400 font-bold text-[10px] uppercase tracking-wider mr-1">Global Tech Hubs:</span>
                <button onclick="handlePresetSearch('bengaluru')" class="text-slate-600 hover:text-[#1a73e8] hover:bg-slate-100 px-2 py-0.5 rounded-md font-bold transition-all">Bengaluru</button>
                <span class="text-slate-300">•</span>
                <button onclick="handlePresetSearch('san francisco')" class="text-slate-600 hover:text-[#1a73e8] hover:bg-slate-100 px-2 py-0.5 rounded-md font-bold transition-all">San Francisco</button>
                <span class="text-slate-300">•</span>
                <button onclick="handlePresetSearch('london')" class="text-slate-600 hover:text-[#1a73e8] hover:bg-slate-100 px-2 py-0.5 rounded-md font-bold transition-all">London</button>
                <span class="text-slate-300">•</span>
                <button onclick="handlePresetSearch('singapore')" class="text-slate-600 hover:text-[#1a73e8] hover:bg-slate-100 px-2 py-0.5 rounded-md font-bold transition-all">Singapore</button>
                <span class="text-slate-300">•</span>
                <button onclick="handlePresetSearch('mumbai')" class="text-slate-600 hover:text-[#1a73e8] hover:bg-slate-100 px-2 py-0.5 rounded-md font-bold transition-all">Mumbai</button>
            </div>
        </div>
    </div>

    <!-- FULL INTERACTIVE APP CONTAINER -->
    <div id="app-container" class="absolute inset-0 z-30 flex flex-col h-full w-full bg-white">
        <!-- Top Navbar -->
        <nav class="top-navbar">
            <div class="navbar-left">
                <button onclick="handleNavbarBack()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 font-extrabold text-xs py-2 px-3 rounded-xl transition-all shrink-0">
                    <i class="fa-solid fa-arrow-left mr-1"></i> Back
                </button>
                <div class="brand-logo cursor-pointer" onclick="resetToLandingState()">
                    <div class="w-9 h-9 rounded-xl bg-[#1a73e8] flex items-center justify-center shadow-lg shadow-blue-500/20">
                        <i class="fa-solid fa-map-location-dot text-white text-sm"></i>
                    </div>
                    <span class="brand-text-label font-extrabold text-lg tracking-tight text-slate-900">Job<span class="text-[#1a73e8]">Map</span></span>
                </div>
                <span class="live-badge">
                    <span class="pulse-dot"></span>
                    <span id="activeMapTitle">Bengaluru</span>
                </span>
            </div>

            <div class="navbar-center">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass search-icon"></i>
                    <input id="unified-search-input" type="text" placeholder="Search city/location ..."
                        onkeydown="if(event.key === 'Enter') handleUnifiedSearch()">
                </div>
            </div>
            
            <div class="navbar-right">
            </div>
        </nav>



        <!-- Main Content Area: Directory & Map -->
        <div class="content-wrapper flex-1 flex overflow-hidden relative">
            <!-- Left Sidebar / Directory List -->
            <aside id="sidebar" class="sidebar">
                <!-- Directory Header Stats -->
                <div class="p-4 border-b border-slate-200/80 bg-slate-50/80 backdrop-blur-sm">
                    <div class="grid grid-cols-3 gap-2 text-center">
                        <div class="stat-card">
                            <span id="stat-companies" class="stat-val">0</span>
                            <span class="stat-lbl">Companies</span>
                        </div>
                        <div class="stat-card">
                            <span id="stat-jobs" class="stat-val">0</span>
                            <span class="stat-lbl">Open Roles</span>
                        </div>
                        <div class="stat-card">
                            <span id="stat-headcount" class="stat-val">0</span>
                            <span class="stat-lbl">Headcount</span>
                        </div>
                    </div>
                </div>

                <!-- Search & Filter Controls -->
                <div class="p-4 border-b border-slate-200/80 bg-slate-50/50 flex flex-col gap-3">
                    <!-- Local Company Search -->
                    <div class="relative flex items-center bg-white rounded-xl border border-slate-200/80 p-2 shadow-inner focus-within:border-blue-400">
                        <i class="fa-solid fa-magnifying-glass text-slate-400 text-sm mr-2 pl-1"></i>
                        <input id="sidebar-search-input" type="text" placeholder="Search company, role, or skill..." class="w-full bg-transparent text-xs font-semibold text-slate-800 placeholder-slate-400 focus:outline-none">
                    </div>

                    <!-- Dropdown Filters Row 1: Work Type & Exp Level -->
                    <div class="grid grid-cols-2 gap-2">
                        <div class="flex items-center bg-white rounded-xl border border-slate-200/80 p-2 shadow-sm focus-within:border-blue-400">
                            <select id="filter-work-type" class="w-full bg-transparent text-xs font-semibold text-slate-700 outline-none cursor-pointer">
                                <option value="">💼 All Types</option>
                                <option value="remote">🏠 Remote</option>
                                <option value="hybrid">🏢 Hybrid</option>
                                <option value="onsite">🏢 On-site</option>
                            </select>
                        </div>
                        <div class="flex items-center bg-white rounded-xl border border-slate-200/80 p-2 shadow-sm focus-within:border-blue-400">
                            <select id="filter-exp-level" class="w-full bg-transparent text-xs font-semibold text-slate-700 outline-none cursor-pointer">
                                <option value="">⏳ All Experience</option>
                                <option value="entry">0-2 yrs</option>
                                <option value="mid">2-5 yrs</option>
                                <option value="senior">5+ yrs</option>
                            </select>
                        </div>
                    </div>

                    <!-- Dropdown Filters Row 2: Salary -->
                    <div class="flex items-center bg-white rounded-xl border border-slate-200/80 p-2 shadow-sm focus-within:border-blue-400">
                        <select id="filter-salary-min" class="w-full bg-transparent text-xs font-semibold text-slate-700 outline-none cursor-pointer">
                            <option value="">💰 All Salaries</option>
                            <option value="5">₹5+ LPA</option>
                            <option value="10">₹10+ LPA</option>
                            <option value="15">₹15+ LPA</option>
                            <option value="20">₹20+ LPA</option>
                            <option value="30">₹30+ LPA</option>
                            <option value="50">₹50+ LPA</option>
                        </select>
                    </div>
                </div>

                <!-- Scrollable Job Directory List -->
                <div id="directory-list" class="directory-list">
                    <div class="p-8 text-center text-slate-400">Loading jobs...</div>
                </div>
            </aside>

            <!-- Interactive MapLibre Map Container -->
            <div id="map" class="map-container">
                <button id="reset-map-btn" class="map-overlay-btn hidden">
                    <i class="fa-solid fa-compass"></i> Reset View
                </button>
            </div>

            <!-- Details Drawer -->
            <div id="details-drawer" class="details-drawer">
                <div class="drawer-header-bar">
                    <button id="back-drawer-btn" class="back-drawer-btn"><i class="fa-solid fa-arrow-left"></i></button>
                    <span class="drawer-top-label">Role & Company Details</span>
                    <button id="close-drawer-btn" class="close-drawer-btn">&times;</button>
                </div>
                <div id="drawer-content" class="drawer-content"></div>
            </div>
        </div>
    </div>

    <button id="mobile-toggle-btn" class="mobile-toggle" aria-label="Toggle directory list"></button>

    <!-- Load complete interactive application logic -->
    <script type="module" src="/static/js/app.js"></script>
    <script>
        function handleSearchFromLanding() {
            const rawCity = document.getElementById('landingCityInput') ? document.getElementById('landingCityInput').value.trim() : '';
            const rawRole = document.getElementById('landingRoleInput') ? document.getElementById('landingRoleInput').value.trim() : '';
            
            const params = new URLSearchParams();
            if (rawCity) {
                params.set('city', rawCity);
            }
            if (rawRole) {
                params.set('role', rawRole);
            }
            if (!rawCity && !rawRole) {
                params.set('city', 'Bengaluru');
            }

            window.location.href = '/jobs?' + params.toString();
        }

        function handlePresetSearch(cityKey) {
            let cityTitle = 'Bengaluru';
            if (cityKey === 'san francisco') cityTitle = 'San Francisco';
            else if (cityKey === 'london') cityTitle = 'London';
            else if (cityKey === 'singapore') cityTitle = 'Singapore';
            else if (cityKey === 'mumbai') cityTitle = 'Mumbai';
            else if (cityKey === 'bengaluru') cityTitle = 'Bengaluru';
            else if (cityKey) {
                cityTitle = cityKey.charAt(0).toUpperCase() + cityKey.slice(1);
            }

            window.location.href = '/jobs?city=' + encodeURIComponent(cityTitle);
        }

        function handleUnifiedSearch() {
            const rawVal = document.getElementById('unified-search-input').value.trim();
            if (window.WorldTechApp && typeof window.WorldTechApp.executeUnifiedSearch === 'function') {
                window.WorldTechApp.executeUnifiedSearch(rawVal);
            }
        }

        window.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const cityParam = params.get('city');
            const qParam = params.get('q');
            const roleParam = params.get('role');
            const query = cityParam || qParam;

            const isJobsRoute = window.location.pathname.startsWith('/jobs') || window.location.pathname.startsWith('/map') || cityParam || qParam || roleParam;
            const landingEl = document.getElementById('landingInterface');
            const appEl = document.getElementById('app-container');

            if (isJobsRoute) {
                if (landingEl) landingEl.style.display = 'none';
                if (appEl) appEl.style.display = 'flex';
            } else {
                if (landingEl) landingEl.style.display = 'flex';
                if (appEl) appEl.style.display = 'none';
            }

            if (query) {
                const titleEl = document.getElementById('activeMapTitle');
                if (titleEl) titleEl.textContent = query;
                const navInput = document.getElementById('unified-search-input');
                if (navInput) navInput.value = query;
            }
        });

        function resetToLandingState() {
            window.location.href = '/';
        }

        function handleNavbarBack() {
            const detailsDrawer = document.getElementById('details-drawer');
            const sidebar = document.getElementById('sidebar');
            const mobileToggleBtn = document.getElementById('mobile-toggle-btn');
            
            if (detailsDrawer && detailsDrawer.classList.contains('active')) {
                window.location.hash = '';
            } else if (window.innerWidth <= 900 && sidebar && sidebar.classList.contains('active')) {
                sidebar.classList.remove('active');
                if (mobileToggleBtn) {
                    mobileToggleBtn.textContent = 'Show Directory';
                }
            } else {
                resetToLandingState();
            }
        }
    </script>


</body>
</html>
